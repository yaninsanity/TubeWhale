
services:
  # PostgreSQL Database  
  postgres:
    image: postgres:15-alpine
    container_name: tubewhale_postgres
    environment:
      POSTGRES_DB: tubewhale
      POSTGRES_USER: tubewhale
      POSTGRES_PASSWORD: tubewhale123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tubewhale_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tubewhale_redis
    command: redis-server --requirepass redis123
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - tubewhale_network

  # TubeWhale Django Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: tubewhale_backend
    depends_on:
      - postgres
      - redis
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - tubewhale_network

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: tubewhale_nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    networks:
      - tubewhale_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  tubewhale_network:
    driver: bridge