{% extends 'admin/master.html' %}

{% block body %}
<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">
        <h1>🔧 CLI Integration</h1>
        <p class="lead">Web UI wrapper for existing CLI features</p>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-6">
            <div class="panel panel-default">
                <div class="panel-heading">
            <h3 class="panel-title">🎥 Video Analysis</h3>
                </div>
                <div class="panel-body">
                    <form method="post" action="{{ url_for('cli.run_command') }}">
                        <div class="form-group">
                            <label for="youtube_url">YouTube URL:</label>
                            <input type="url" class="form-control" id="youtube_url" name="youtube_url" 
                                   placeholder="https://www.youtube.com/watch?v=...">
                        </div>
                        <div class="form-group">
                <label for="analysis_type">Analysis Type:</label>
                            <select class="form-control" id="analysis_type" name="analysis_type">
                <option value="transcript">Transcript Analysis</option>
                <option value="summary">Summary</option>
                <option value="expert">Expert Analysis</option>
                            </select>
                        </div>
            <button type="submit" class="btn btn-primary">Start Analysis</button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="panel panel-default">
                <div class="panel-heading">
            <h3 class="panel-title">📊 Batch Operations</h3>
                </div>
                <div class="panel-body">
                    <div class="btn-group-vertical" role="group" style="width: 100%;">
            <button type="button" class="btn btn-info">Export Data</button>
            <button type="button" class="btn btn-warning">Batch Analyze</button>
            <button type="button" class="btn btn-success">Database Backup</button>
            <button type="button" class="btn btn-danger">Clear Cache</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-12">
            <div class="alert alert-warning">
        <h4>⚠️ Note</h4>
        <p>CLI integration is under active development and will remain fully compatible with the original command-line tool.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
