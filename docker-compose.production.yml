version: '3.8'

services:
  # PostgreSQL Database  
  postgres:
    image: postgres:15-alpine
    container_name: tubewhale_postgres
    environment:
      POSTGRES_DB: tubewhale
      POSTGRES_USER: tubewhale
      POSTGRES_PASSWORD: tubewhale123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tubewhale_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tubewhale -d tubewhale"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tubewhale_redis
    command: redis-server --requirepass redis123 --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - tubewhale_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # TubeWhale Django Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: tubewhale_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # 确保Django使用正确的数据库和Redis配置
      - DATABASE_URL=postgresql://tubewhale:tubewhale123@postgres:5432/tubewhale
      - REDIS_URL=redis://:redis123@redis:6379/0
      - CELERY_BROKER_URL=redis://:redis123@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:redis123@redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - tubewhale_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/tubewhale/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Celery Worker for Background Tasks
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: tubewhale_celery_worker
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # Celery配置
      - DATABASE_URL=postgresql://tubewhale:tubewhale123@postgres:5432/tubewhale
      - REDIS_URL=redis://:redis123@redis:6379/0
      - CELERY_BROKER_URL=redis://:redis123@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:redis123@redis:6379/0
      - CELERY_WORKER_CONCURRENCY=4
      - CELERY_WORKER_MAX_TASKS_PER_CHILD=1000
    command: celery -A tubewhale_project worker --loglevel=info --concurrency=4 --queues=celery,analysis --max-tasks-per-child=1000
    volumes:
      - .:/app
    networks:
      - tubewhale_network
    healthcheck:
      test: ["CMD-SHELL", "celery -A tubewhale_project inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Celery Beat Scheduler
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: tubewhale_celery_beat
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql://tubewhale:tubewhale123@postgres:5432/tubewhale
      - REDIS_URL=redis://:redis123@redis:6379/0
      - CELERY_BROKER_URL=redis://:redis123@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:redis123@redis:6379/0
    command: celery -A tubewhale_project beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    networks:
      - tubewhale_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tubewhale_nginx
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    networks:
      - tubewhale_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  tubewhale_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16