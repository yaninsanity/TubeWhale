version: '3.8'

services:
  # PostgreSQL Database  
  postgres:
    image: postgres:15-alpine
    container_name: tubewhale_postgres
    environment:
      POSTGRES_DB: tubewhale
      POSTGRES_USER: tubewhale
      POSTGRES_PASSWORD: tubewhale123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tubewhale_network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: tubewhale_redis
    command: redis-server --requirepass redis123
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - tubewhale_network

  # TubeWhale Django Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: tubewhale_backend
    depends_on:
      - postgres
      - redis
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - tubewhale_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/templates/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker - Analysis Tasks
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: tubewhale_celery_worker
    entrypoint: ["sh", "-c"]
    command: ["sleep 10 && celery -A tubewhale_project worker --loglevel=info --queues=analysis,video_processing,default"]
    depends_on:
      - postgres  
      - redis
      - backend
    env_file:
      - .env.docker
    volumes:
      - .:/app
      - media_volume:/app/media
    networks:
      - tubewhale_network
    healthcheck:
      test: ["CMD", "celery", "-A", "tubewhale_project", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Celery Beat - Scheduled Tasks
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: tubewhale_celery_beat
    entrypoint: ["sh", "-c"]
    command: ["sleep 15 && celery -A tubewhale_project beat --loglevel=info"]
    depends_on:
      - postgres
      - redis
      - backend
    env_file:
      - .env.docker
    volumes:
      - .:/app
    networks:
      - tubewhale_network  
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tubewhale_nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    networks:
      - tubewhale_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  tubewhale_network:
    driver: bridge