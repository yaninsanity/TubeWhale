
version: '3.8'

services:
  # PostgreSQL Database - 解决队友的PostgreSQL问题
  postgres:
    image: postgres:15-alpine
    container_name: tubewhale_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tubewhale
      POSTGRES_USER: tubewhale
      POSTGRES_PASSWORD: tubewhale123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - tubewhale_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tubewhale -d tubewhale"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tubewhale_redis
    restart: unless-stopped
    command: redis-server --requirepass redis123 --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - tubewhale_network
    healthcheck:
      test: ["CMD", "redis-cli", "auth", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # TubeWhale Django Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: tubewhale_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media:rw
      - ./logs:/app/logs:rw
    networks:
      - tubewhale_network
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--database", "default"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "3", "--worker-class", "sync", "--timeout", "300", "tubewhale_project.wsgi:application"]

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: tubewhale_celery_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    env_file:
      - .env.docker
    volumes:
      - ./media:/app/media:rw
      - ./logs:/app/logs:rw
    networks:
      - tubewhale_network
    command: ["celery", "-A", "tubewhale_project", "worker", "--loglevel=info", "--concurrency=2", "--pool=prefork"]
    healthcheck:
      test: ["CMD", "celery", "-A", "tubewhale_project", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Celery Beat Scheduler
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: tubewhale_celery_beat
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    env_file:
      - .env.docker
    volumes:
      - ./logs:/app/logs:rw
    networks:
      - tubewhale_network
    command: ["celery", "-A", "tubewhale_project", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    healthcheck:
      test: ["CMD", "celery", "-A", "tubewhale_project", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  tubewhale_network:
    driver: bridge