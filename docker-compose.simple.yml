services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tubewhale_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tubewhale
      POSTGRES_USER: tubewhale
      POSTGRES_PASSWORD: tubewhale123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tubewhale_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tubewhale_redis
    restart: unless-stopped
    command: redis-server --requirepass redis123
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - tubewhale_network

  # TubeWhale Django Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tubewhale_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media:rw
      - ./logs:/app/logs:rw
      - ./staticfiles:/app/staticfiles:rw
    networks:
      - tubewhale_network

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tubewhale_celery_worker
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - backend
    env_file:
      - .env
    volumes:
      - ./media:/app/media:rw
      - ./logs:/app/logs:rw
    networks:
      - tubewhale_network
    command: ["celery", "-A", "tubewhale_project", "worker", "--loglevel=info", "--concurrency=2"]

  # Celery Beat Scheduler
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tubewhale_celery_beat
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - backend
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs:rw
    networks:
      - tubewhale_network
    command: ["celery", "-A", "tubewhale_project", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  tubewhale_network:
    driver: bridge