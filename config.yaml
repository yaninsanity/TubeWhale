# TubeWhale Configuration
# Professional video analysis and data collection

user:
  user_id: "default_user"
  project_name: "TubeWhale Data Collection"
  tier: "standard"  # free, standard, premium, enterprise
  video_quota: 100
  daily_limit: 20

database:
  path: "tubewhale.db"
  backup_enabled: true

youtube:
  api_keys:
    - "YOUR_YOUTUBE_API_KEY"
  rate_limit: 100
  timeout: 30.0
  retry_attempts: 3

openai:
  api_key: "YOUR_OPENAI_API_KEY"
  model: "gpt-4"
  max_tokens: 4096
  temperature: 0.7
  timeout: 60.0
