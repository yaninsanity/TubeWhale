# Nginx reverse proxy for TubeWhale
# Production hardened minimal config

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 4096;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml;

    # Upstream to gunicorn container (web)
    upstream tube_backend {
        server web:8000;  # docker-compose service name
    }

    server {
        listen 80 default_server;
        server_name _;

        # Security headers (basic set)
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer-when-downgrade;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=63072000";

        # Health check (served by gunicorn/Django)
        location /health/ { proxy_pass http://tube_backend/api/v1/tubewhale/health/; }

        # Static & media (served directly if mounted)
        location /static/ {
            alias /static/;  # mount volume
            access_log off;
            expires 30d;
        }
        location /media/ {
            alias /media/;
            access_log off;
            expires 30d;
        }

        # WebSocket / SSE upgrade support (if future needed)
        location /ws/ { proxy_pass http://tube_backend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }

        # Default proxy pass
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_pass http://tube_backend;
        }
    }
}
