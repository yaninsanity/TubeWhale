version: '3.9'

services:
  web:
    build: .
    image: tubewhale/web:latest
    env_file:
      - .env
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "4", "--timeout", "120", "tubewhale_project.wsgi:application"]
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/tubewhale/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - static_volume:/static
      - media_volume:/media
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health/" ]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  celery-worker:
    build: .
    image: tubewhale/worker:latest
    command: ["celery", "-A", "tubewhale_project", "worker", "--loglevel=INFO"]
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  celery-beat:
    build: .
    image: tubewhale/beat:latest
    command: ["celery", "-A", "tubewhale_project", "beat", "--loglevel=INFO"]
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

volumes:
  static_volume:
  media_volume:
